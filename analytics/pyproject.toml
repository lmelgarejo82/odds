[project]
name = "ou25-analytics"
version = "0.1.0"
description = "Reproducible, temporally safe analytics foundation for OU25 Market V2"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "duckdb>=1.1",
  "matplotlib>=3.9",
  "numpy>=2.0",
  "pandas>=2.2",
  "pyarrow>=17",
  "pydantic>=2.9",
  "scikit-learn>=1.5",
  "scipy>=1.14",
  "statsmodels>=0.14",
]

[project.scripts]
ou25-analytics = "ou25_analytics.cli:main"

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
  "mypy>=1.13",
  "pandas-stubs>=2.2",
  "pytest>=8.3",
  "pytest-cov>=6.0",
  "ruff>=0.8",
]

[tool.hatch.build.targets.wheel]
packages = ["src/ou25_analytics"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["ou25_analytics"]

[tool.coverage.report]
fail_under = 85
show_missing = true
skip_covered = true

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["B", "E", "F", "I", "SIM", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_configs = true
packages = ["ou25_analytics"]
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["duckdb.*", "pyarrow.*"]
ignore_missing_imports = true
